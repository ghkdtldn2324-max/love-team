<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자주 묻는 질문 | 로브팀</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#111;
  font-family:Arial,sans-serif;
}

/* ===== HEADER ===== */

header{
  height:72px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  padding:0 30px;
  position:relative;
  z-index:9999;
}

.logo{
  color:white;
  text-decoration:none;
  font-weight:900;
  font-size:22px;
  white-space:nowrap;
}

nav{
  display:flex;
  gap:24px;
  margin-left:auto;
  margin-right:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
  white-space:nowrap;
}

.actions{
  display:flex;
  align-items:center;
  gap:15px;
}

.actions a{
  color:white;
  text-decoration:none;
  font-size:14px;
  white-space:nowrap;
}

.kakao{
  background:#ffe812;
  color:#111 !important;
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
}

/* 모바일 버튼 */
.mobile-menu-btn{
  display:none;
  margin-left:auto;
  background:none;
  border:0;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.mobile-menu{
  display:none;
  position:absolute;
  top:72px;
  left:0;
  right:0;
  background:#111;
  padding:15px;
  border-top:1px solid #333;
}

.mobile-menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:14px 10px;
  border-bottom:1px solid #292929;
}

.mobile-menu .kakao-mobile{
  margin-top:12px;
  background:#ffe812;
  color:#111;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  border:0;
}

/* ===== FAQ ===== */

.faq-wrap{
  max-width:900px;
  margin:50px auto;
  padding:0 20px;
}

.faq-wrap h1{
  margin-bottom:30px;
}

.faq-item{
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}

.faq-question{
  width:100%;
  padding:20px;
  background:linear-gradient(135deg,#6d28d9,#9333ea);
  color:white;
  border:0;
  text-align:left;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.faq-answer{
  display:none;
  padding:20px;
  background:white;
  color:#333;
  line-height:1.7;
}

.faq-item.active .faq-answer{
  display:block;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

  header{
    height:64px;
    padding:0 15px;
  }

  nav{
    display:none !important;
  }

  .actions a:first-child{
    display:none;
  }

  .actions .kakao{
    display:none;
  }

  .actions{
    margin-left:auto;
    margin-right:8px;
  }

  .actions a{
    display:block;
    font-size:13px;
  }

  .mobile-menu-btn{
    display:block;
  }

  .mobile-menu.active{
    display:block;
  }

  .faq-wrap{
    margin:30px auto;
    padding:0 15px;
  }

  .faq-question{
    font-size:14px;
    padding:17px 15px;
  }

  .faq-answer{
    font-size:14px;
    padding:17px 15px;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">LOVE TEAM</a>

  <nav>
    <a href="index.html">공지사항</a>
    <a href="faq.html">자주 묻는 질문</a>
    <a href="pricing.html">가격표</a>
    <a href="works.html">작업 내역</a>
    <a href="reviews.html">후기</a>
  </nav>

  <div class="actions">
    <a href="index.html#cart">장바구니</a>

    <a href="#login"
       id="openAuth"
       data-auth-open>
      로그인 / 회원가입
    </a>

    <a
      class="kakao"
      href="https://open.kakao.com/"
      target="_blank">
      카카오 고객센터
    </a>
  </div>

  <button
    class="mobile-menu-btn"
    id="mobileMenuBtn">
    ⋮
  </button>

  <div
    class="mobile-menu"
    id="mobileMenu">

    <a href="index.html">공지사항</a>
    <a href="faq.html">자주 묻는 질문</a>
    <a href="pricing.html">가격표</a>
    <a href="works.html">작업 내역</a>
    <a href="reviews.html">후기</a>

    <a href="#login" id="mobileOpenAuth">
      로그인 / 회원가입
    </a>

    <a
      class="kakao-mobile"
      href="https://open.kakao.com/"
      target="_blank">
      카카오 고객센터
    </a>

  </div>

</header>


<main class="faq-wrap">

  <h1>자주 묻는 질문</h1>

  <div class="faq-item">
    <button class="faq-question">
      Q. 작업은 어떻게 진행되나요?
      <span>+</span>
    </button>

    <div class="faq-answer">
      A. 상담 후 원하는 작업을 확인하고 결제 및 작업을 진행합니다.
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      Q. 작업 시간은 얼마나 걸리나요?
      <span>+</span>
    </button>

    <div class="faq-answer">
      A. 작업 종류와 상황에 따라 달라질 수 있습니다.
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question">
      Q. 작업 후 문제가 생기면 어떻게 하나요?
      <span>+</span>
    </button>

    <div class="faq-answer">
      A. 카카오 고객센터를 통해 문의해 주세요.
    </div>
  </div>

</main>


<script>

/* FAQ 열기/닫기 */

document.querySelectorAll(".faq-question").forEach(button => {

  button.addEventListener("click", () => {

    const item = button.parentElement;
    const icon = button.querySelector("span");

    item.classList.toggle("active");

    icon.textContent =
      item.classList.contains("active")
      ? "−"
      : "+";

  });

});


/* 모바일 메뉴 */

const mobileMenuBtn =
  document.getElementById("mobileMenuBtn");

const mobileMenu =
  document.getElementById("mobileMenu");

mobileMenuBtn.addEventListener("click", () => {

  mobileMenu.classList.toggle("active");

});


/* 메뉴 누르면 자동 닫기 */

document.querySelectorAll("#mobileMenu a").forEach(link => {

  link.addEventListener("click", () => {

    mobileMenu.classList.remove("active");

  });

});


/* 모바일 로그인/회원가입 */

document
  .getElementById("mobileOpenAuth")
  .addEventListener("click", e => {

    e.preventDefault();

    const authBtn =
      document.getElementById("openAuth");

    if(authBtn){
      authBtn.click();
    }

  });

</script>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
