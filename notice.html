.notice-hero{
  position:relative;
  min-height:250px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:

    linear-gradient(120deg,#090a12 0%,#12132a 48%,#0b0914 100%);
  border-bottom:0;
}
.notice-hero::before,
.notice-hero::after{
  content:"";
  position:absolute;
  pointer-events:none;
}
.notice-hero::before{
  width:620px;
  height:620px;
  right:-190px;
  top:-260px;
  border:1px solid rgba(153,117,255,.18);
  transform:rotate(34deg);
  box-shadow:
    0 0 0 38px rgba(102,116,255,.035),
    0 0 0 76px rgba(184,78,255,.025);
}
.notice-hero::after{
  width:460px;
  height:2px;
  left:-80px;
  bottom:48px;
  background:linear-gradient(90deg,transparent,#657dff,transparent);
  transform:rotate(-24deg);

.notice-hero-inner{position:relative;z-index:2;padding:54px 20px}

.notice-page{

.notice-board-head{

.notice-board-title{

.notice-board-desc{

.notice-board-badge{

.notice-table{

.notice-table-head,
.notice-item{

.notice-table-head span:nth-child(1),
.notice-table-head span:nth-child(3),
.notice-table-head span:nth-child(4),
.notice-table-head span:nth-child(5){

}
.notice-table-head span:nth-child(2){

}
.notice-item{
  position:relative;
  min-height:88px;
  padding:14px 18px;
  color:#171722;
  text-decoration:none;
  border-bottom:1px solid #e8e6ed;

    background .2s ease,
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}
.notice-item:first-of-type{

}
.notice-item:hover .notice-no{

}
.notice-item:hover .notice-main strong{

.notice-item{
  background:#fff !important;
  box-shadow:none !important;
  outline:none !important;
  border-left:0 !important;
  -webkit-tap-highlight-color:transparent;
}
.notice-item:hover,
.notice-item:focus,
.notice-item:focus-visible,
.notice-item:active,
.notice-item:visited{
  outline:none !important;
}
.notice-item.is-hover{

}
.notice-item.is-hover .notice-main strong{

}
.notice-item .notice-main strong{

}
@media (hover:none), (pointer:coarse){

  .notice-item:focus,

<script>
// 마우스를 올렸을 때만 강조 효과를 허용하고,
// 클릭/포커스가 남아 있어도 강조 상태가 고정되지 않도록 초기화합니다.
document.querySelectorAll('.notice-item').forEach(function(item){
  item.addEventListener('pointerenter',function(event){
    if(event.pointerType === 'mouse'){
      item.classList.add('is-hover');
    }
  });
  item.addEventListener('pointerleave',function(){
    item.classList.remove('is-hover');
    item.blur();
  });
  item.addEventListener('pointercancel',function(){
    item.classList.remove('is-hover');
    item.blur();
  });
  item.addEventListener('click',function(){
    item.classList.remove('is-hover');
    item.blur();
  });
  item.addEventListener('focus',function(){
    item.classList.remove('is-hover');
    item.blur();
  });
});
window.addEventListener('pageshow',function(){
  document.querySelectorAll('.notice-item').forEach(function(item){
    item.classList.remove('is-hover');
    item.blur();
  });
});

(async function(){
  const client = window.LoveTeamSupabase || window.supabaseClient;
  if(!client) return;
  try{
    const { data, error } = await client
      .from('notice_view_counts')
      .select('notice_id,views');
    if(error) throw error;
    (data || []).forEach(function(row){
      const el=document.querySelector('[data-notice-views="' + row.notice_id + '"]');
      if(el) el.textContent=Number(row.views || 0).toLocaleString('ko-KR');
    });
  }catch(error){
    console.error('공지사항 조회수 불러오기 실패:',error);
  }
})();
</script>
<script>
function formatNoticeDate(value){
  if(!value) return '-';
  const date=new Date(value);
  if(Number.isNaN(date.getTime())) return String(value).replace(/-/g,'.');
  return date.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});
}
async function loadNotices(){
  const client=window.LoveTeamSupabase||window.supabaseClient;
  const list=document.getElementById('noticeList'), total=document.getElementById('noticeTotal');
  if(!client){list.innerHTML='<div class="notice-empty">공지사항을 불러오지 못했습니다.</div>';return;}
  try{
    const r=await client.from('notices').select('id,title,summary,author,published_at').order('published_at',{ascending:false}).order('id',{ascending:false});
    if(r.error)throw r.error;
    const vr=await client.from('notice_view_counts').select('notice_id,views');
    const views={};(vr.data||[]).forEach(x=>views[String(x.notice_id)]=Number(x.views||0));
    const data=r.data||[];
    total.textContent='TOTAL '+data.length.toLocaleString('ko-KR');
    if(!data.length){list.innerHTML='<div class="notice-empty">등록된 공지사항이 없습니다.</div>';return;}
    list.innerHTML=data.map(function(n,i){
      const date=formatNoticeDate(n.published_at);
      return '<a class="notice-item" data-notice-id="'+escapeHtml(n.id)+'" href="notice-detail.html?id='+encodeURIComponent(n.id)+'"><span class="notice-no">'+(data.length-i)+'</span><div class="notice-main"><strong>'+escapeHtml(n.title)+(i===0?' <span class="notice-new">NEW</span>':'')+'</strong><span>'+escapeHtml(n.summary||'')+'</span></div><span class="notice-author">'+escapeHtml('로브팀')+'</span><span class="notice-date">'+escapeHtml(date)+'</span><span class="notice-views">'+(views[String(n.id)]||0).toLocaleString('ko-KR')+'</span></a>';
    }).join('');
    document.querySelectorAll('.notice-item').forEach(function(item){
      item.addEventListener('pointerenter',function(ev){if(ev.pointerType==='mouse')item.classList.add('is-hover');});
      item.addEventListener('pointerleave',function(){item.classList.remove('is-hover');item.blur();});
      item.addEventListener('pointercancel',function(){item.classList.remove('is-hover');item.blur();});
      item.addEventListener('click',function(){item.classList.remove('is-hover');item.blur();});
    });
  }catch(err){console.error('공지사항 불러오기 실패:',err);total.textContent='TOTAL -';list.innerHTML='<div class="notice-empty">공지사항을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';}
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
loadNotices();
</script>
