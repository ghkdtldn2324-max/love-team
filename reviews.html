```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOVE TEAM | 후기</title>

<link rel="stylesheet" href="style.css">

<style>
.reviews-page{
  background:#fff;
  min-height:calc(100vh - 174px);
  padding:86px 20px 110px;
  color:#171722
}

.reviews-wrap{
  max-width:1000px;
  margin:0 auto
}

.reviews-head{
  text-align:center;
  margin-bottom:34px
}

.reviews-head h1{
  font-size:36px;
  margin:0 0 10px
}

.reviews-head p:last-child{
  color:#777889;
  font-size:13px;
  margin:0
}

.review-list{
  border-top:1px solid #e8e5ef
}

.review-row{
  padding:24px 10px;
  border-bottom:1px solid #e8e5ef
}

.review-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:12px
}

.review-user{
  font-size:15px;
  font-weight:900
}

.stars{
  letter-spacing:2px;
  font-size:14px;
  background:linear-gradient(90deg,#4d91ff,#a74fe9);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.review-date{
  font-size:11px;
  color:#92929e;
  white-space:nowrap
}

.review-text{
  font-size:14px;
  line-height:1.8;
  color:#4e4e5c;
  margin:0
}

.review-meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:11px;
  font-size:11px;
  color:#92929e
}

.review-service{
  padding:5px 9px;
  border-radius:999px;
  background:#f2edff;
  color:#7042d0;
  font-weight:800
}

.reviews-note{
  text-align:center;
  margin:25px 0 0;
  color:#92929e;
  font-size:11px
}

.admin-link{
  display:none
}


/* =========================
   후기 작성 영역
   ========================= */

.review-write-area{
  background:#fff;
  border:1px solid #e8e5ef;
  border-radius:16px;
  padding:24px;
  margin-bottom:34px;
  box-shadow:0 10px 30px rgba(40,30,70,.05)
}

.review-write-head{
  margin-bottom:20px
}

.review-write-kicker{
  margin:0 0 5px;
  font-size:9px;
  letter-spacing:1.5px;
  color:#8b56df;
  font-weight:900
}

.review-write-head h2{
  margin:0 0 5px;
  font-size:21px
}

.review-write-head p:last-child{
  margin:0;
  color:#888895;
  font-size:11px
}

.review-write-label{
  display:block;
  margin-top:13px;
  font-size:11px;
  font-weight:800;
  color:#444
}

.review-write-label select,
.review-write-label textarea{
  display:block;
  width:100%;
  margin-top:6px;
  box-sizing:border-box;
  border:1px solid #ddd9e8;
  border-radius:9px;
  padding:11px;
  font:inherit;
  font-size:12px;
  outline:none;
  background:#fff
}

.review-write-label select{
  height:42px
}

.review-write-label textarea{
  min-height:110px;
  resize:vertical
}

.review-write-label select:focus,
.review-write-label textarea:focus{
  border-color:#8662ed;
  box-shadow:0 0 0 3px rgba(134,98,237,.08)
}

.review-write-message{
  display:none;
  margin:12px 0 0;
  padding:9px 11px;
  border-radius:8px;
  background:#f5f1ff;
  color:#6d4ee8;
  font-size:11px
}

.review-write-message.error{
  background:#fff0f1;
  color:#c33
}

.review-submit{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:9px;
  padding:12px;
  background:linear-gradient(100deg,#4e8fff,#a64de9);
  color:#fff;
  font-weight:800;
  cursor:pointer
}

.review-login-notice{
  margin-bottom:34px;
  padding:18px;
  border-radius:13px;
  background:#f7f5fb;
  text-align:center;
  color:#777;
  font-size:12px
}

.review-login-notice button{
  border:0;
  background:none;
  color:#7042d0;
  font-weight:900;
  cursor:pointer;
  padding:0 3px
}


/* =========================
   모바일
   ========================= */

@media(max-width:600px){

  .reviews-page{
    padding:62px 16px 80px
  }

  .reviews-head h1{
    font-size:29px
  }

  .review-row{
    padding:21px 4px
  }

  .review-top{
    align-items:flex-start
  }

  .review-date{
    font-size:10px
  }

  .review-text{
    font-size:13px
  }

  .review-write-area{
    padding:18px;
    border-radius:13px;
    margin-bottom:28px
  }

  .review-write-head h2{
    font-size:19px
  }

  .review-write-label select,
  .review-write-label textarea{
    font-size:13px
  }

}
</style>
</head>

<main>

<section class="reviews-page">

  <div class="reviews-wrap">

    <div class="reviews-head">
      <p class="eyebrow">LOVE TEAM REVIEWS</p>
      <h1>고객 후기</h1>

      <label class="review-write-label">

      </label>


      <label class="review-write-label">

        <select id="reviewStars">

          <option value="5">

          </option>

          <option value="4">

          <option value="3">

      <label class="review-write-label">

        <textarea
          id="reviewText"
          maxlength="300"
          placeholder="이용 후기를 작성해주세요."
        ></textarea>

      </label>


      <p
        id="reviewWriteMessage"
        class="review-write-message"
      ></p>


      <button
        type="button"
        id="reviewSubmit"
        class="review-submit"

    </div>


    <!-- 로그아웃 상태에서 보이는 안내 -->

    <div
      id="reviewLoginNotice"

      <button
        type="button"
        id="reviewLoginButton"
      >

      </button>

      해주세요.

    </div>


    <!-- 후기 목록 -->

    <div
      id="reviewList"
      class="review-list"
    ></div>


    <p class="reviews-note">
      ※ 고객 이름은 개인정보 보호를 위해 일부만 공개됩니다.
    </p>

  </div>

</section>

</main>


<footer>

  <strong>LOVE TEAM</strong>

  <p>
    © 2
