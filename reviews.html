<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후기 | 로브팀</title>
<link rel="stylesheet" href="style.css">

<style>
/* 모바일 메뉴 */
.mobile-menu-btn{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:25px;
  cursor:pointer;
  padding:4px 8px;
}

.mobile-menu{
  display:none;
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#111;
  border-top:1px solid #333;
  padding:15px;
  z-index:9999;
}

.mobile-menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:14px 10px;
  border-bottom:1px solid #292929;
}

.mobile-menu .kakao-mobile{
  margin-top:12px;
  background:#ffe812;
  color:#111;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  border:0;
}

@media(max-width:600px){
  .nav{
    display:none !important;
  }

  .mobile-menu-btn{
    display:block;
  }

  .header-actions a:not(#openAuth){
    display:none !important;
  }

  header{
    position:relative;
  }

  .mobile-menu.active{
    display:block;
  }
}
</style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">LOVE TEAM</a>

  <nav class="nav">
    <a href="index.html">공지사항</a>
    <a href="faq.html">자주 묻는 질문</a>
    <a href="pricing.html">가격표</a>
    <a href="works.html">작업 내역</a>
    <a href="reviews.html">후기</a>
  </nav>

  <div class="header-actions">
    <a href="index.html#cart">장바구니</a>
    <a href="#login" id="openAuth" data-auth-open>로그인 / 회원가입</a>
    <a href="https://open.kakao.com/" target="_blank">카카오 고객센터</a>
  </div>

  <button class="mobile-menu-btn" id="mobileMenuBtn">⋮</button>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">공지사항</a>
    <a href="faq.html">자주 묻는 질문</a>
    <a href="pricing.html">가격표</a>
    <a href="works.html">작업 내역</a>
    <a href="reviews.html">후기</a>
    <a href="#login" id="mobileOpenAuth">로그인 / 회원가입</a>
    <a class="kakao-mobile" href="https://open.kakao.com/" target="_blank">
      카카오 고객센터
    </a>
  </div>
</header>

<main class="container">
  <h1>후기</h1>

  <div id="reviewsList"></div>
</main>

<script>
const reviewsList = document.getElementById("reviewsList");

function loadReviews(){
  const reviews = JSON.parse(localStorage.getItem("reviews") || "[]");

  if(!reviews.length){
    reviewsList.innerHTML = `
      <div style="padding:30px;text-align:center;color:#aaa;">
        아직 등록된 후기가 없습니다.
      </div>
    `;
    return;
  }

  reviewsList.innerHTML = reviews.map(review => `
    <div class="review-item" style="
      background:#151515;
      border:1px solid #292929;
      border-radius:12px;
      padding:20px;
      margin-bottom:15px;
    ">
      <div style="margin-bottom:8px;">
        ${"★".repeat(Number(review.rating || 5))}
        ${"☆".repeat(5 - Number(review.rating || 5))}
      </div>

      <div style="font-weight:bold;margin-bottom:8px;">
        ${review.name || "익명"}
      </div>

      <div style="color:#ddd;line-height:1.6;">
        ${review.content || ""}
      </div>

      <div style="color:#777;font-size:13px;margin-top:12px;">
        ${review.date || ""}
      </div>
    </div>
  `).join("");
}

loadReviews();

/* 모바일 메뉴 */
const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const mobileMenu = document.getElementById("mobileMenu");

mobileMenuBtn.addEventListener("click", () => {
  mobileMenu.classList.toggle("active");
});

document.querySelectorAll("#mobileMenu a").forEach(link => {
  link.addEventListener("click", () => {
    mobileMenu.classList.remove("active");
  });
});

document.getElementById("mobileOpenAuth").addEventListener("click", e => {
  e.preventDefault();

  const authBtn = document.getElementById("openAuth");

  if(authBtn){
    authBtn.click();
  }
});
</script>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
