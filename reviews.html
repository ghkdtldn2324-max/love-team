<script>
(function(){
  var fallback=[
    {name:'Ja***',stars:5,text:'진행 과정이 깔끔했고 원하는 부분을 자세하게 설명해주셔서 만족했습니다.',date:'2026.09.28',service:'승당'},
    {name:'Mi***',stars:5,text:'플레이 방향을 잡는 데 도움이 많이 됐습니다. 문의 답변도 빠르게 받을 수 있었습니다.',date:'2026.09.27',service:'티어'},
    {name:'Ho***',stars:4,text:'일정 조율이 편했고 진행 상황도 안내받을 수 있어서 좋았습니다.',date:'2026.09.25',service:'듀오'},
    {name:'Se***',stars:5,text:'배치 진행 전에 필요한 내용을 안내받아서 처음 이용하는데도 어렵지 않았습니다.',date:'2026.09.23',service:'배치고사'},
    {name:'Lu***',stars:5,text:'전체적으로 친절하게 진행해주셨고 게임에 대한 피드백도 이해하기 쉬웠습니다.',date:'2026.09.21',service:'승당'}
  ];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
  function getData(){try{var d=JSON.parse(localStorage.getItem('loveTeamReviews'));return Array.isArray(d)&&d.length?d:fallback;}catch(e){return fallback;}}
  function render(){var list=document.getElementById('reviewList');if(!list)return;var data=getData();list.innerHTML=data.map(function(r){var n=Math.max(0,Math.min(5,Number(r.stars)||0));return '<article class="review-row"><div class="review-top"><div><span class="review-user">'+esc(r.name)+' 님</span><span class="stars" aria-label="'+n+'점">'+('★'.repeat(n))+'</span></div><span class="review-date">'+esc(r.date)+'</span></div><p class="review-text">'+esc(r.text)+'</p><span class="review-service">'+esc(r.service)+'</span></article>';}).join('');}
  render();
})();
</script>
