name: Build clean LOVE TEAM logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove white/checkerboard and preserve logo detail
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import numpy as np
          src="assets/A4E32EAD-F882-47A5-B734-26DDE13717DF.png"
          dst="assets/love-team-main-logo-final.png"
          im=Image.open(src).convert("RGBA")
          a=np.array(im).astype(np.float32)
          rgb=a[:,:,:3]/255.0
          mx=rgb.max(2); mn=rgb.min(2)
          sat=np.where(mx==0,0,(mx-mn)/np.maximum(mx,1e-6))
          val=mx
          alpha=a[:,:,3]/255.0
          threshold=0.10 + 0.08*(1-val)
          keep=(sat>=threshold) | (val<0.38)
          a[:,:,3]=(alpha*keep*255).round().astype(np.uint8)
          Image.fromarray(a.astype(np.uint8),"RGBA").save(dst,optimize=True)
          PY
      - name: Commit cleaned logo and remove temporary workflow
        run: |
          rm -f .github/workflows/clean-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/love-team-main-logo-final.png .github/workflows/clean-logo.yml
          git commit -m "Add clean transparent homepage logo [skip ci]"
          git push
