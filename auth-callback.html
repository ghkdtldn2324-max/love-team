<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOVE TEAM 인증 처리 중</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090d;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}.box{text-align:center;padding:30px}.spinner{width:34px;height:34px;margin:0 auto 18px;border:3px solid #444;border-top-color:#8b5cf6;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{color:#aaa;font-size:14px}</style>
</head>
<body><div class="box"><div class="spinner"></div><h2>인증 처리 중입니다.</h2><p>잠시만 기다려 주세요.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async()=>{
  const home = new URL('index.html', location.href).href;
  try{
    const client = supabase.createClient(window.LOVE_TEAM_SUPABASE_URL, window.LOVE_TEAM_SUPABASE_PUBLISHABLE_KEY);
    const params = new URLSearchParams(location.search);
    const token_hash = params.get('token_hash');
    const type = params.get('type');
    if(token_hash){
      const verifyType = type === 'recovery' ? 'recovery' : 'signup';
      const {error}=await client.auth.verifyOtp({token_hash,type:verifyType});
      if(error) throw error;
    }
    // Supabase가 이미 hash 기반 세션을 만든 경우에도 index.html로 넘긴다.
    const hash = location.hash || '';
    location.replace(home + hash);
  }catch(e){
    console.error(e);
    location.replace(home + '?auth_error=1');
  }
})();
</script></body></html>
