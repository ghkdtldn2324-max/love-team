<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LOVE TEAM | 작업 관리</title><link rel="stylesheet" href="style.css"><style>
body{background:#f5f6fb;color:#171722}.admin{max-width:1000px;margin:0 auto;padding:60px 20px}.admin h1{margin-bottom:8px}.admin p{color:#777889}.panel{background:#fff;border:1px solid #e8e5ef;border-radius:16px;padding:22px;margin-top:24px}.row{display:grid;grid-template-columns:110px 1fr 150px 130px 90px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.row input,.row select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;background:linear-gradient(135deg,#4d91ff,#a74fe9);color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#777}.actions{display:flex;gap:10px;margin-top:18px}@media(max-width:700px){.row{grid-template-columns:1fr;gap:7px}.row b{margin-top:10px}}
</style></head><body><div class="admin"><h1>작업 내역 관리</h1><p>이 페이지는 일반 사이트 메뉴에 연결하지 않는 관리자용 화면입니다.</p><div class="panel"><div id="rows"></div><div class="actions"><button class="btn" onclick="addRow()">작업 추가</button><button class="btn" onclick="save()">저장</button><button class="btn gray" onclick="resetData()">예시 데이터 복원</button></div></div></div><script>
const fallback=[{name:'Gh***',type:'win',detail:'승당 3판 진행 중',status:'progress'},{name:'Ab***',type:'tier',detail:'플레티넘 → 다이아몬드',status:'done'},{name:'Lo***',type:'duo',detail:'듀오 5판 진행 중',status:'progress'},{name:'Ki***',type:'placement',detail:'배치고사 4판 진행 중',status:'progress'},{name:'Mi***',type:'win',detail:'승당 7판 완료',status:'done'},{name:'Se***',type:'tier',detail:'골드 → 플래티넘',status:'done'}];
let data=(()=>{try{return JSON.parse(localStorage.getItem('loveTeamWorks'))||structuredClone(fallback)}catch(e){return structuredClone(fallback)}})();
function render(){document.getElementById('rows').innerHTML=data.map((x,i)=>`<div class="row"><input value="${x.name}" oninput="data[${i}].name=this.value"><select onchange="data[${i}].type=this.value"><option value="win" ${x.type==='win'?'selected':''}>승당</option><option value="tier" ${x.type==='tier'?'selected':''}>티어</option><option value="duo" ${x.type==='duo'?'selected':''}>듀오</option><option value="placement" ${x.type==='placement'?'selected':''}>배치고사</option></select><input value="${x.detail}" oninput="data[${i}].detail=this.value"><select onchange="data[${i}].status=this.value"><option value="progress" ${x.status==='progress'?'selected':''}>진행 중</option><option value="done" ${x.status==='done'?'selected':''}>완료</option></select><button class="btn gray" onclick="data.splice(${i},1);render()">삭제</button></div>`).join('')}
function addRow(){data.push({name:'New***',type:'win',detail:'승당 1판 진행 중',status:'progress'});render()}function save(){localStorage.setItem('loveTeamWorks',JSON.stringify(data));alert('저장했습니다. 같은 브라우저의 작업 내역 페이지에 반영됩니다.')}function resetData(){data=structuredClone(fallback);localStorage.setItem('loveTeamWorks',JSON.stringify(data));render()}render();
</script></body></html>
