<link rel="stylesheet" href="style.css?v=20260930-3">
<style>
/* 작업 내역 모바일 가독성 개선 */
@media(max-width:600px){
  .works-page{
    padding:54px 12px 78px;
    background:linear-gradient(180deg,#fff 0%,#faf9fd 100%);
  }
  .works-wrap{
    width:100%;
  }
  .works-head{
    margin-bottom:25px;
    padding:0 4px;
  }
  .works-head .eyebrow{
    font-size:10px;
    letter-spacing:2.8px;
    margin-bottom:8px;
  }
  .works-head h1{
    font-size:30px;
    letter-spacing:-1.4px;
    margin-bottom:9px;
  }
  .works-head p:last-child{
    font-size:13px;
    line-height:1.65;
  }

  .work-status-list{
    border:0;
    border-radius:0;
    padding:0;
    background:transparent;
    overflow:visible;
  }
  .work-status-row{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:12px;
    min-height:0;
    margin-bottom:11px;
    padding:17px 15px 15px;
    border:1px solid #e4e0ec;
    border-radius:16px;
    background:#fff;
    box-shadow:0 6px 18px rgba(45,32,100,.06);
  }
  .work-status-row:last-child{
    margin-bottom:0;
  }
  .work-status-row::before{
    content:"";
    position:absolute;
    left:-1px;
    top:12px;
    bottom:12px;
    width:3px;
    border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,#765cff,#a14cff);
  }
  .work-left{
    width:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    padding-left:3px;
  }
  .work-user{
    display:block;
    width:100%;
    font-size:15px;
    line-height:1.35;
    letter-spacing:-.2px;
    color:#171722;
  }
  .work-detail{
    display:block;
    width:100%;
    max-width:none;
    overflow:visible;
    white-space:normal;
    text-overflow:clip;
    color:#5e5d6c;
    font-size:13px;
    line-height:1.55;
    word-break:keep-all;
  }
  .work-status{
    align-self:flex-start;
    min-height:28px;
    padding:5px 10px;
    border-radius:999px;
    font-size:11px;
    line-height:1;
    border:1px solid transparent;
  }
  .work-status::before{
    width:7px;
    height:7px;
    box-shadow:none!important;
  }
  .work-status.progress{
    color:#6644cf;
    background:#f3efff;
    border-color:#ddd2ff;
  }
  .work-status.done{
    color:#247c59;
    background:#eefaf5;
    border-color:#cceede;
  }
  .works-note{
    margin:19px 5px 0;
    font-size:10px;
    line-height:1.6;
    word-break:keep-all;
  }
}
</style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="메뉴 열기">☰</button>

<main class="works-page"><div class="works-wrap"><div class="works-head"><p class="eyebrow">LOVE TEAM WORKS</p><h1>작업 내역</h1><p>진행 중인 작업과 완료된 작업을 익명으로 안내합니다.</p></div><div id="workList" class="work-status-list" aria-label="작업 내역 목록"></div><p class="works-note">※ 고객 이름은 일부만 공개되며, 1:1 강의 작업은 작업 내역에 표시하지 않습니다.</p></div></main>

<script src="supabase-config.js"></script>

<script src="auth.js?v=20261001-26"></script>
<script src="script.js?v=20260930-11"></script>
<script>
(function(){
  const list=document.getElementById("workList");
  const fallback=[
    {display_name:"Gh***",detail:"승당 3판 진행 중",status:"progress"},
    {display_name:"Ab***",detail:"플레티넘 → 다이아몬드",status:"done"},
    {display_name:"Lo***",detail:"듀오 5판 진행 중",status:"progress"},
    {display_name:"Ki***",detail:"배치고사 4판 진행 중",status:"progress"},
    {display_name:"Mi***",detail:"승당 7판 완료",status:"done"},
    {display_name:"Se***",detail:"골드 → 플래티넘",status:"done"}
  ];

  function escapeHtml(value){
    return String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function render(rows){
    list.innerHTML=(rows||[]).map(function(x){
      return '<div class="work-status-row"><div class="work-left"><span class="work-user">'+
        escapeHtml(x.display_name)+' 님</span><span class="work-detail">'+
        escapeHtml(x.detail)+'</span></div><span class="work-status '+
        (x.status==="done"?"done":"progress")+'">'+
        (x.status==="done"?"완료":"진행 중")+
        '</span></div>';
    }).join("");

    if(!rows || !rows.length){
      list.innerHTML='<div class="work-status-row"><div class="work-left"><span class="work-detail">현재 등록된 작업 내역이 없습니다.</span></div></div>';
    }
  }

  async function load(){
    try{
      if(!window.supabase || typeof window.supabase.createClient!=="function"){
        render(fallback);
        return;
      }

      const client=window.LoveTeamAuth && window.LoveTeamAuth.client;
      if(!client){
        render(fallback);
        return;
      }

      const {data,error}=await client
        .from("work_history")
        .select("display_name,detail,status,created_at")
        .order("created_at",{ascending:false});

      if(error){
        console.error("work_history 조회 오류:",error);
        render(fallback);
        return;
      }

      render(data || []);
    }catch(error){
      console.error("작업 내역 불러오기 오류:",error);
      render(fallback);
    }
  }

  load();
})();
</script>
</body>
