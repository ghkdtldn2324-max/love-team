<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LOVE TEAM | 작업 내역</title><link rel="stylesheet" href="style.css">
<style>
.works-page{background:#fff;min-height:calc(100vh - 174px);padding:86px 20px 110px;color:#171722}.works-wrap{max-width:920px;margin:0 auto}.works-head{text-align:center;margin-bottom:34px}.works-head .eyebrow{margin-bottom:9px}.works-head h1{font-size:36px;margin:0 0 10px}.works-head p:last-child{color:#777889;font-size:13px;margin:0}.work-status-list{border-top:1px solid #e8e5ef}.work-status-row{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 12px;border-bottom:1px solid #e8e5ef}.work-left{display:flex;align-items:center;gap:14px;min-width:0}.work-user{font-size:15px;font-weight:800;white-space:nowrap}.work-detail{font-size:13px;color:#686878;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:900;white-space:nowrap}.work-status::before{content:"";width:8px;height:8px;border-radius:50%;display:inline-block}.work-status.progress{color:#6d4ee8}.work-status.progress::before{background:linear-gradient(135deg,#4d91ff,#a74fe9);box-shadow:0 0 0 4px rgba(111,93,232,.10)}.work-status.done{color:#278b63}.work-status.done::before{background:#31a675;box-shadow:0 0 0 4px rgba(49,166,117,.10)}.works-note{text-align:center;margin:24px 0 0;color:#92929e;font-size:11px}@media(max-width:600px){.works-page{padding:62px 16px 80px}.works-head h1{font-size:29px}.work-status-row{min-height:76px;padding:0 4px}.work-left{gap:9px}.work-user{font-size:14px}.work-detail{font-size:11px}.work-status{font-size:11px}}
</style></head>
<body><div class="top-notice">아시아서버 추가 비용 없이 이용가능</div><header class="header"><a class="logo" href="index.html" aria-label="LOVE TEAM 홈"><span class="logo-mark">♥</span><span class="logo-text"><strong>LOVE</strong><small>TEAM</small></span></a><nav class="nav"><a href="notice.html">공지사항</a><a href="faq.html">자주 묻는 질문</a><a href="pricing.html">가격표</a><a href="works.html">작업 내역</a><a href="reviews.html">후기</a></nav><div class="header-actions"><a href="#cart">장바구니</a><a href="#login">로그인 / 회원가입</a><a class="kakao-btn" href="https://open.kakao.com/" target="_blank" rel="noopener">💬 고객센터</a></div></header>
<main><section class="works-page"><div class="works-wrap"><div class="works-head"><p class="eyebrow">LOVE TEAM WORKS</p><h1>작업 내역</h1><p>진행 중인 작업과 완료된 작업을 익명으로 안내합니다.</p></div><div id="workList" class="work-status-list" aria-label="작업 내역 목록"></div><p class="works-note">※ 고객 이름은 일부만 공개되며, 1:1 강의 작업은 작업 내역에 표시하지 않습니다.</p></div></section></main><footer><strong>LOVE TEAM</strong><p>© 2026 LOVE TEAM. All rights reserved.</p></footer>
<script>
const fallback=[
{name:'Gh***',type:'win',detail:'승당 3판 진행 중',status:'progress'},
{name:'Ab***',type:'tier',detail:'플레티넘 → 다이아몬드',status:'done'},
{name:'Lo***',type:'duo',detail:'듀오 5판 진행 중',status:'progress'},
{name:'Ki***',type:'placement',detail:'배치고사 4판 진행 중',status:'progress'},
{name:'Mi***',type:'win',detail:'승당 7판 완료',status:'done'},
{name:'Se***',type:'tier',detail:'골드 → 플래티넘',status:'done'}];
function getData(){try{return JSON.parse(localStorage.getItem('loveTeamWorks'))||fallback}catch(e){return fallback}}
function render(){const list=document.getElementById('workList');list.innerHTML=getData().map(x=>`<div class="work-status-row"><div class="work-left"><span class="work-user">${x.name} 님</span><span class="work-detail">${x.detail}</span></div><span class="work-status ${x.status==='done'?'done':'progress'}">${x.status==='done'?'완료':'진행 중'}</span></div>`).join('')}
render();
</script><script src="auth.js"></script></body></html>
