/* 작업 내역 모바일 가독성 개선 */
@media(max-width:600px){
  .works-page{
    padding:54px 12px 78px;
    background:linear-gradient(180deg,#fff 0%,#faf9fd 100%);
  }
  .works-wrap{
    width:100%;
  }
  .works-head{
    margin-bottom:25px;
    padding:0 4px;
  }
  .works-head .eyebrow{
    font-size:10px;
    letter-spacing:2.8px;
    margin-bottom:8px;
  }
  .works-head h1{
    font-size:30px;
    letter-spacing:-1.4px;
    margin-bottom:9px;
  }
  .works-head p:last-child{
    font-size:13px;
    line-height:1.65;
  }

  .work-status-list{
    border:0;
    border-radius:0;
    padding:0;
    background:transparent;
    overflow:visible;
  }
  .work-status-row{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    justify-content:flex-start;
    gap:12px;
    min-height:0;
    margin-bottom:11px;
    padding:17px 15px 15px;
    border:1px solid #e4e0ec;
    border-radius:16px;
    background:#fff;
    box-shadow:0 6px 18px rgba(45,32,100,.06);
  }
  .work-status-row:last-child{
    margin-bottom:0;
  }
  .work-status-row::before{
    content:"";
    position:absolute;
    left:-1px;
    top:12px;
    bottom:12px;
    width:3px;
    border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,#765cff,#a14cff);
  }
  .work-left{
    width:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    padding-left:3px;
  }
  .work-user{
    display:block;
    width:100%;
    font-size:15px;
    line-height:1.35;
    letter-spacing:-.2px;
    color:#171722;
  }
  .work-detail{
    display:block;
    width:100%;
    max-width:none;
    overflow:visible;
    white-space:normal;
    text-overflow:clip;
    color:#5e5d6c;
    font-size:13px;
    line-height:1.55;
    word-break:keep-all;
  }
  .work-status{
    align-self:flex-start;
    min-height:28px;
    padding:5px 10px;
    border-radius:999px;
    font-size:11px;
    line-height:1;
    border:1px solid transparent;
  }
  .work-status::before{
    width:7px;
    height:7px;
    box-shadow:none!important;
  }
  .work-status.progress{
    color:#6644cf;
    background:#f3efff;
    border-color:#ddd2ff;
  }
  .work-status.done{
    color:#247c59;
    background:#eefaf5;
    border-color:#cceede;
  }
  .works-note{
    margin:19px 5px 0;
    font-size:10px;
    line-height:1.6;
    word-break:keep-all;
  }
}
</style>

<script>
(function(){
 const list=document.getElementById("workList");
 const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
 const parse=v=>{try{return JSON.parse(v||"{}")}catch(e){return {title:v||"작업 내역",content:""}}};
 const fmt=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleDateString("ko-KR"):"-"};
 async function load(){
  const client=window.LoveTeamAuth&&window.LoveTeamAuth.client;
  if(!client){list.innerHTML="<div class=\"work-empty\">작업 내역을 불러올 수 없습니다.</div>";return;}
  const q=await client.from("work_history").select("id,display_name,detail,status,created_at").order("created_at",{ascending:false});
  if(q.error){list.innerHTML="<div class=\"work-empty\">작업 내역을 불러오지 못했습니다.</div>";return;}
  const rows=q.data||[];
  list.innerHTML=rows.length?rows.map((r,i)=>{const d=parse(r.detail);return "<article class=\"work-post\"><span class=\"work-post-no\">"+(rows.length-i)+"</span><span class=\"work-post-status "+(r.status==="done"?"done":"progress")+"\">"+(r.status==="done"?"작업완료":"진행중")+"</span><div class=\"work-post-title\">"+esc(d.title)+"</div><div class=\"work-post-meta\"><span>"+esc(r.display_name||"관리자")+"</span><span>"+fmt(r.created_at)+"</span><span>조회 0</span></div><div class=\"work-post-body\">"+esc(d.content)+"</div></article>"}).join(""):"<div class=\"work-empty\">등록된 작업 내역이 없습니다.</div>";
 }
 load();
})();
</script>
