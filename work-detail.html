<script>
(function(){
  const el=document.getElementById("detail");
  const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const parse=v=>{try{const x=JSON.parse(v||"{}");return {title:x.title||"작업 내역",content:x.content||"",layout:x.layout||"",images:Array.isArray(x.images)?x.images:[],kakaoUrl:x.kakaoUrl||""}}catch(e){return {title:v||"작업 내역",content:"",layout:"",images:[],kakaoUrl:""}}};
  const workAuthorName=v=>{
    const name=String(v||"").trim();
    return name.toLowerCase()==="qxazrty@love-team.local" ? "로브팀" : (name||"관리자");
  };
  const fmt=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"};
  async function load(){
    const id=new URLSearchParams(location.search).get("id");
    if(!id){el.innerHTML='<div class="work-detail-empty">작업 내역을 찾을 수 없습니다.</div>';return}
    const client=(window.LoveTeamAuth&&window.LoveTeamAuth.client)||window.LoveTeamSupabase;
    if(!client){el.innerHTML='<div class="work-detail-empty">작업 내역을 불러올 수 없습니다.</div>';return}
    try{
      const q=await client.from("work_history").select("id,display_name,detail,status,created_at").eq("id",id).maybeSingle();
      if(q.error||!q.data){el.innerHTML='<div class="work-detail-empty">작업 내역을 찾을 수 없습니다.</div>';return}
      const r=q.data,d=parse(r.detail);
      let views=0;
      const progressLayout=d.layout==="love-progress-v1";
      const bodyHtml=progressLayout
        ? '<section class="work-progress-template">'+
            d.images.map(src=>'<img class="work-progress-image" src="'+esc(src)+'" alt="로브팀 작업 안내 이미지">').join("")+
            '<div class="work-progress-copy">'+esc(d.content)+'</div>'+
            (d.kakaoUrl?'<a class="work-progress-kakao" href="'+esc(d.kakaoUrl)+'" target="_blank" rel="noopener"><span class="kakao-talk-icon" aria-hidden="true"><i></i><i></i><i></i></span>카카오톡 오픈채팅 상담</a>':"")+
          '</section>'
        : (r.status==="done"
          ? '<section class="work-progress-empty"><div class="work-detail-content-text">'+(d.content&&d.content!=="작업완료"?esc(d.content):"작업이 완료되었습니다.")+'</div></section>'
          : '<section class="work-detail-content"><div class="work-detail-content-text">'+esc(d.content)+'</div></section>');
      el.innerHTML='<article class="work-detail-head"><p class="eyebrow">LOVE TEAM WORKS</p><h1>'+esc(d.title)+'</h1><div class="work-detail-meta"><span>상태 <strong>'+(r.status==="done"?"작업완료":"진행중")+'</strong></span><span>관리자 <strong>'+esc(workAuthorName(r.display_name))+'</strong></span><span>작성일 <strong>'+fmt(r.created_at)+'</strong></span><span>조회수 <strong id="workDetailViews">0</strong></span></div></article>'+bodyHtml+'<div class="work-detail-actions"><a class="work-detail-back" href="works.html">← 작업 내역으로 돌아가기</a></div>';

      try{
        const viewResult=await client.rpc("increment_work_view",{p_work_id:r.id});
        if(!viewResult.error){
          const value=Array.isArray(viewResult.data)
            ? (viewResult.data[0]?.views ?? viewResult.data[0]?.increment_work_view ?? viewResult.data[0])
            : viewResult.data;
          views=Number(value||0);
        }else{
          const countResult=await client.from("work_view_counts").select("views").eq("work_id",r.id).maybeSingle();
          if(!countResult.error) views=Number(countResult.data?.views||0);
        }
      }catch(viewError){
        console.warn("작업 조회수 처리 실패:",viewError);
      }

      const viewsEl=document.getElementById("workDetailViews");
      if(viewsEl) viewsEl.textContent=views.toLocaleString("ko-KR");
    }catch(error){
      console.error("작업 상세 불러오기 실패:",error);
      el.innerHTML='<div class="work-detail-empty">작업 내역을 불러오지 못했습니다.</div>';
    }
  }
  load();
  const mb=document.getElementById("mobileMenuBtn"),mm=document.getElementById("mobileMenu");
  if(mb&&mm){
    mb.addEventListener("click",function(e){
      e.preventDefault();
      e.stopPropagation();
      const o=mm.classList.toggle("active");
      mb.textContent=o?"✕":"☰";
      mb.setAttribute("aria-label",o?"메뉴 닫기":"메뉴 열기");
    });
    mm.querySelectorAll("a").forEach(function(a){
      a.addEventListener("click",function(){
        if(a.id!=="mobileOpenAuth"){
          mm.classList.remove("active");
          mb.textContent="☰";
          mb.setAttribute("aria-label","메뉴 열기");
        }
      });
    });
  }
})();
</script>
