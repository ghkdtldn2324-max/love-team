<script>
(function(){
  const el=document.getElementById("detail");

  };
  const fmt=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"};
  const fmtDateOnly=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\s+/g," ").trim().replace(/\.\s*$/,"."):"-"};

    '<p>로브팀은 이러한 다양한 요소를 고려하여 고객님께서 원하시는 목표와 현재 실력에 맞춰 서비스를 진행하고 있습니다.</p>'+
    '<p>특히 강의 및 코칭 서비스의 경우 단순히 게임을 함께하는 것에 그치지 않고, 에임, 포지셔닝, 교전 판단, 유틸리티 활용, 라운드 운영 등 실력 향상에 필요한 부분을 체계적으로 안내해드리는 것을 목표로 합니다.</p>'+
    '<p>또한 듀오 및 랭크 관련 서비스 역시 고객님의 요청사항과 목표에 맞춰 안정적으로 진행될 수 있도록 관리하고 있습니다.</p>'+
    '<h2>진행 과정 및 작업 안내</h2>'+
    '<p>서비스가 진행되는 동안 고객님께서는 상담을 통해 안내받은 진행 방식에 따라 작업 내용을 확인하실 수 있습니다.</p>'+
    '<p>작업이 완료된 이후에는 해당 작업에 대한 진행 결과 및 작업 내역을 확인하실 수 있으며, 고객님께서 보다 편리하게 서비스 진행 상황을 확인할 수 있도록 관리하고 있습니다.</p>'+
    '<p>또한 실제 이용 고객님들의 소중한 후기와 작업 내역을 통해 로브팀의 서비스를 직접 확인하실 수 있습니다.</p>'+
    '<h2>차별화된 발로란트 서비스를 원하신다면</h2>'+
    '<p>보다 체계적인 발로란트 서비스와 친절한 상담을 원하신다면 카카오톡 오픈채팅을 통해 편하게 문의해주세요.</p>'+
    '<p>처음 이용하시는 고객님도 궁금하신 부분이나 서비스 진행 방식에 대해 부담 없이 상담받으실 수 있도록 자세하게 안내해드리겠습니다.</p>'+
    '<p>로브팀은 고객님의 만족도 높은 서비스 이용을 위해 상담부터 진행 과정까지 세심하게 관리하겠습니다.</p>'+
    '<p class="work-complete-final"><strong>발로 대리 · 발로듀오 · 발로강의 · 랭크 코칭 · 실력 향상 코칭,<br>신속하고 안전한 서비스를 원하신다면 로브팀과 함께하세요.</strong></p>'+
  '</div>'+
'</section>'
          : '<section class="work-detail-content"><div class="work-detail-content-text">'+esc(d.content)+'</div></section>');
      el.innerHTML='<article class="work-detail-head"><p class="eyebrow">LOVE TEAM WORKS</p><h1>'+esc(d.title)+'</h1><div class="work-detail-meta"><span>강의 작업 현황 <strong>'+(r.status==="done"?"작업완료":"진행중")+'</strong></span><span>글쓴이 <strong>'+esc(workAuthorName(r.display_name))+'</strong></span><span>작성일 <strong>'+fmtDateOnly(r.created_at)+'</strong></span><span>조회수 <strong id="workDetailViews">0</strong></span></div></article>'+bodyHtml+'<div class="work-detail-actions"><a class="work-detail-back" href="works.html">← 작업 내역으로 돌아가기</a></div>';

      try{
        const viewResult=await client.rpc("increment_work_view",{p_work_id:r.id});
        if(!viewResult.error){
          const value=Array.isArray(viewResult.data)
            ? (viewResult.data[0]?.views ?? viewResult.data[0]?.increment_work_view ?? viewResult.data[0])
            : viewResult.data;
          views=Number(value||0);
        }else{
          const countResult=await client.from("work_view_counts").select("views").eq("work_id",r.id).maybeSingle();
          if(!countResult.error) views=Number(countResult.data?.views||0);
        }
      }catch(viewError){
        console.warn("작업 조회수 처리 실패:",viewError);
      }

      const viewsEl=document.getElementById("workDetailViews");
      if(viewsEl) viewsEl.textContent=views.toLocaleString("ko-KR");
    }catch(error){
      console.error("작업 상세 불러오기 실패:",error);
      el.innerHTML='<div class="work-detail-empty">작업 내역을 불러오지 못했습니다.</div>';

  load();
  const mb=document.getElementById("mobileMenuBtn"),mm=document.getElementById("mobileMenu");
  if(mb&&mm){
    mb.addEventListener("click",function(e){
      e.preventDefault();
      e.stopPropagation();
      const o=mm.classList.toggle("active");
      mb.textContent=o?"✕":"☰";
      mb.setAttribute("aria-label",o?"메뉴 닫기":"메뉴 열기");
    });
    mm.querySelectorAll("a").forEach(function(a){
      a.addEventListener("click",function(){
        if(a.id!=="mobileOpenAuth"){
          mm.classList.remove("active");
          mb.textContent="☰";
          mb.setAttribute("aria-label","메뉴 열기");
        }
      });
    });
  }
})();

<script id="lt-breadcrumb-dynamic-v1">
(function(){
  var category="작업 내역";
  var pageUrl="https://ghkdtldn2324-max.github.io/love-team/work-detail.html";
  var root=document.body;
  function esc(v){return String(v==null?"":v).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]||c;});}
  function upsert(title){
    title=String(title||"").trim();
    if(!title)return;
    var seoTitle=title+" | 로브팀";
    var seoDescription=title+" - 발로란트 작업 내역 | 로브팀";
    document.title=seoTitle;
    document.querySelectorAll('meta[name="description"],meta[property="og:description"],meta[name="twitter:description"]').forEach(function(m){m.setAttribute("content",seoDescription);});
    document.querySelectorAll('meta[property="og:title"],meta[name="twitter:title"]').forEach(function(m){m.setAttribute("content",seoTitle);});
    var old=document.getElementById("lt-breadcrumb-jsonld");
    if(old)old.remove();
    var pageSchema=document.getElementById("lt-detail-webpage-jsonld");
    if(pageSchema)pageSchema.remove();
    var ws=document.createElement("script");
    ws.type="application/ld+json";ws.id="lt-detail-webpage-jsonld";
    ws.textContent=JSON.stringify({"@context":"https://schema.org","@type":"WebPage","name":seoTitle,"description":seoDescription,"url":location.href,"isPartOf":{"@type":"WebSite","name":"로브팀","url":"https://ghkdtldn2324-max.github.io/love-team/"}});
    document.head.appendChild(ws);
    var s=document.createElement("script");
    s.type="application/ld+json";s.id="lt-breadcrumb-jsonld";
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"홈","item":"https://ghkdtldn2324-max.github.io/love-team/"},{"@type":"ListItem","position":2,"name":category,"item":new URL("works.html",location.href).href},{"@type":"ListItem","position":3,"name":title}]});
    document.head.appendChild(s);
    var cur=document.querySelector(".lt-breadcrumb .current"); if(cur)cur.textContent=title;
  }
  function findTitle(){
    if("work-detail.html"==="notice-detail.html"){var e=document.getElementById("title");return e&&e.textContent;}
    if("work-detail.html"==="work-detail.html"){var e=document.querySelector("#detail h1,#detail h2,.work-detail-title");return e&&e.textContent;}
    var e=document.querySelector(".review-detail-title");return e&&e.textContent;
  }
  var lastTitle="";
  function sync(){var t=findTitle();if(t && t.trim()!==lastTitle){lastTitle=t.trim();upsert(t);}}
  new MutationObserver(sync).observe(root,{subtree:true,childList:true,characterData:true});
  document.addEventListener("DOMContentLoaded",sync);
  setTimeout(sync,500);setTimeout(sync,1500);
})();
</script>

<script id="lt-dynamic-canonical-v1">
(function(){
  var params=new URLSearchParams(location.search);
  if(!params.get("id"))return;
  var canonicalUrl=location.href.split("#")[0];
  var link=document.querySelector('link[rel="canonical"]');
  if(!link){link=document.createElement("link");link.rel="canonical";document.head.appendChild(link);}
  link.href=canonicalUrl;
  var og=document.querySelector('meta[property="og:url"]');
  if(!og){og=document.createElement("meta");og.setAttribute("property","og:url");document.head.appendChild(og);}
  og.setAttribute("content",canonicalUrl);
})();
</script>
