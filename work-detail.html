<body class="lt-works-page">
<header class="header">
<a class="logo" href="index.html" aria-label="LOVE TEAM 홈"><img class="logo-image" src="assets/love-team-logo-transparent.png?v=20261001-transparent" alt="LOVE TEAM"></a>

</header>
<div class="page-divider" aria-hidden="true"></div>
<main class="work-detail-page"><div class="work-detail-wrap"><div id="detail"></div></div></main>
<footer><strong>LOVE TEAM</strong><p>© 2026 LOVE TEAM. All rights reserved.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js?v=20261001-26"></script>
<script>
(function(){
  const el=document.getElementById("detail");
  const esc=v=>String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const parse=v=>{try{return JSON.parse(v||"{}")}catch(e){return {title:v||"작업 내역",content:""}}};
  const fmt=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"};
  async function load(){
    const id=new URLSearchParams(location.search).get("id");
    if(!id){el.innerHTML='<div class="work-detail-empty">작업 내역을 찾을 수 없습니다.</div>';return}
    const client=window.LoveTeamAuth&&window.LoveTeamAuth.client;
    if(!client){el.innerHTML='<div class="work-detail-empty">작업 내역을 불러올 수 없습니다.</div>';return}
    const q=await client.from("work_history").select("id,display_name,detail,status,created_at").eq("id",id).maybeSingle();
    if(q.error||!q.data){el.innerHTML='<div class="work-detail-empty">작업 내역을 찾을 수 없습니다.</div>';return}
    const r=q.data,d=parse(r.detail);
    el.innerHTML='<article class="work-detail-head"><p class="eyebrow">LOVE TEAM WORKS</p><h1>'+esc(d.title)+'</h1><div class="work-detail-meta"><span>관리자 '+esc(r.display_name||"관리자")+'</span><span>'+fmt(r.created_at)+'</span><span>'+(r.status==="done"?"작업완료":"진행중")+'</span><span>조회 0</span></div></article><div class="work-detail-content">'+esc(d.content)+'</div><a class="work-detail-back" href="works.html">← 작업 내역으로 돌아가기</a>';
  }
  load();
  const mb=document.getElementById("mb"),mm=document.getElementById("mm");
  if(mb&&mm)mb.onclick=()=>{const o=mm.classList.toggle("active");mb.textContent=o?"✕":"☰"};
})();
</script>
<script>
(function(){
  var header=document.querySelector('.header');
  if(!header) return;
  function sync(){ header.classList.toggle('page-scrolled',window.scrollY>8); }
  window.addEventListener('scroll',sync,{passive:true});
  sync();
})();
</script>
</body>
</html>
