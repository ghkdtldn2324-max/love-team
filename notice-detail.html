<script>
const params=new URLSearchParams(location.search);
const rawId=params.get('id')||'';
const isEventNotice=
  rawId==='love-team-event-10plus1' ||
  rawId==='love-team-event-10plus1/' ||
  params.get('event')==='10plus1';
let id=Number(rawId||0);
const titleEl=document.getElementById('title');
const authorEl=document.getElementById('author');
const dateEl=document.getElementById('date');
const viewsEl=document.getElementById('views');
const contentEl=document.getElementById('content');

function renderContent(raw){
  contentEl.innerHTML='';
  const article=document.createElement('div');
  article.className='content-block';
  const p=document.createElement('p');
  p.textContent=String(raw||'') || '등록된 공지사항 내용이 없습니다.';
  article.appendChild(p);
  contentEl.appendChild(article);
}

function formatNoticeDate(value){
  if(!value) return '-';
  const date=new Date(value);
  if(Number.isNaN(date.getTime())) return String(value).replace(/-/g,'.');
  return date.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});
}

async function loadNotice(){
  const client=window.LoveTeamSupabase||window.supabaseClient;
  const eventTitle='[이벤트] 맡김 랭크 10+1 서비스 진행';

  try{
    // 구형 이벤트 링크(slug)도 실제 DB 공지 ID로 해석합니다.
    if(isEventNotice){
      if(!client) throw new Error('Supabase 연결을 확인할 수 없습니다.');
      const eventResult=await client.from('notices')
        .select('id')
        .eq('title',eventTitle)
        .order('id',{ascending:false})
        .limit(1)
        .maybeSingle();
      if(eventResult.error) throw eventResult.error;
      if(!eventResult.data){
        throw new Error('이벤트 공지가 아직 등록되지 않았습니다.');
      }
      id=Number(eventResult.data.id);
    }

    if(!client||!Number.isInteger(id)||id<1){
      titleEl.textContent='공지사항을 찾을 수 없습니다.';
      authorEl.textContent='-';
      dateEl.textContent='-';
      viewsEl.textContent='-';
      renderContent('요청하신 공지사항을 찾을 수 없습니다.');
      return;
    }

    const result=await client.from('notices')
      .select('id,title,content,author,published_at')
      .eq('id',id)
      .maybeSingle();
    if(result.error) throw result.error;
    if(!result.data){
      titleEl.textContent='공지사항을 찾을 수 없습니다.';
      authorEl.textContent='-';
      dateEl.textContent='-';
      viewsEl.textContent='-';
      renderContent('요청하신 공지사항이 존재하지 않습니다.');
      return;
    }

    const notice=result.data;
    titleEl.textContent=notice.title||'';
    authorEl.textContent='로브팀';
    dateEl.textContent=formatNoticeDate(notice.published_at);
    viewsEl.textContent='집계 중';
    renderContent(notice.content);

    // 모든 공지는 동일한 조회수 로직을 사용합니다.
    const viewResult=await client.rpc('increment_notice_view',{p_notice_id:id});
    if(!viewResult.error){
      const rpcValue=Array.isArray(viewResult.data)
        ? (viewResult.data[0]?.views ?? viewResult.data[0]?.increment_notice_view ?? viewResult.data[0])
        : viewResult.data;
      if(rpcValue!==null&&rpcValue!==undefined&&rpcValue!==''){
        viewsEl.textContent=Number(rpcValue||0).toLocaleString('ko-KR');
        return;
      }
    }

    const countResult=await client.from('notice_view_counts')
      .select('notice_id,views')
      .eq('notice_id',id)
      .maybeSingle();
    if(countResult.error) throw countResult.error;

    const nextViews=Number(countResult.data?.views||0)+1;
    const writeResult=countResult.data
      ? await client.from('notice_view_counts').update({views:nextViews}).eq('notice_id',id)
      : await client.from('notice_view_counts').insert({notice_id:id,views:1});
    if(writeResult.error) throw writeResult.error;
    viewsEl.textContent=nextViews.toLocaleString('ko-KR');
  }catch(error){
    console.error('공지사항 상세 처리 실패:',error);
    viewsEl.textContent='-';
    if(isEventNotice){
      titleEl.textContent=eventTitle;
      authorEl.textContent='LOVE TEAM';
      dateEl.textContent='-';
      renderContent('이벤트 공지를 불러오지 못했습니다. 관리자 페이지에서 실제 공지 등록 상태를 확인해주세요.');
    }
  }
}
loadNotice();
</script>
<script id="lt-breadcrumb-dynamic-v1">
(function(){
  var category="공지사항";
  var pageUrl="https://ghkdtldn2324-max.github.io/love-team/notice-detail.html";
  var root=document.body;
  function esc(v){return String(v==null?"":v).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]||c;});}
  function upsert(title){
    title=String(title||"").trim();
    if(!title)return;
    var old=document.getElementById("lt-breadcrumb-jsonld");
    if(old)old.remove();
    var s=document.createElement("script");
    s.type="application/ld+json";s.id="lt-breadcrumb-jsonld";
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"홈","item":"https://ghkdtldn2324-max.github.io/love-team/"},{"@type":"ListItem","position":2,"name":category,"item":new URL("notice.html",location.href).href},{"@type":"ListItem","position":3,"name":title}]});
    document.head.appendChild(s);
    var cur=document.querySelector(".lt-breadcrumb .current,#noticeBreadcrumbTitle"); if(cur && cur.textContent!==title)cur.textContent=title;
  }
  function findTitle(){
    if("notice-detail.html"==="notice-detail.html"){var e=document.getElementById("title");return e&&e.textContent;}
    if("notice-detail.html"==="work-detail.html"){var e=document.querySelector("#detail h1,#detail h2,.work-detail-title");return e&&e.textContent;}
    var e=document.querySelector(".review-detail-title");return e&&e.textContent;
  }
  var lastTitle="";
  function sync(){var t=findTitle();if(t && t.trim()!==lastTitle){lastTitle=t.trim();upsert(t);}}
  new MutationObserver(sync).observe(root,{subtree:true,childList:true,characterData:true});
  document.addEventListener("DOMContentLoaded",sync);
  setTimeout(sync,500);setTimeout(sync,1500);
})();
</script>
