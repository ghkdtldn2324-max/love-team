<script src="script.js?v=20260930-11"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=20261001-26"></script>
<script>
const params=new URLSearchParams(location.search);
const rawId=params.get('id')||'';
const isEventNotice=
  rawId==='love-team-event-10plus1' ||
  rawId==='love-team-event-10plus1/' ||
  params.get('event')==='10plus1';
const id=Number(rawId||0);
const titleEl=document.getElementById('title');
const authorEl=document.getElementById('author');
const dateEl=document.getElementById('date');
const viewsEl=document.getElementById('views');
const contentEl=document.getElementById('content');

function renderContent(raw){
  contentEl.innerHTML='';
  const article=document.createElement('div');
  article.className='content-block';
  const p=document.createElement('p');
  p.textContent=String(raw||'') || '등록된 공지사항 내용이 없습니다.';
  article.appendChild(p);
  contentEl.appendChild(article);
}

function formatNoticeDate(value){
  if(!value) return '-';
  const date=new Date(value);
  if(Number.isNaN(date.getTime())) return String(value).replace(/-/g,'.');
  return date.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function loadNotice(){
  const client=window.LoveTeamSupabase||window.supabaseClient;
  if(isEventNotice){
    titleEl.textContent='[이벤트] 맡김 랭크 10+1 서비스 진행';
    authorEl.textContent='LOVE TEAM';
    dateEl.textContent=formatNoticeDate(new Date().toISOString());
    viewsEl.textContent='-';
    renderContent('안녕하세요! 로브팀 입니다.\n\n저희 로브팀을 이용해주시는 고객님들께 대리랭크 10승 진행하시면 1승을 서비스 차원에서 무료로 진행해드립니다!\n\n아래 진행 중인 다른 이벤트를 참고하여 주시고 많은 참여와 관심 부탁 드려요.\n\n오늘도 찾아주셔서 감사합니다. 고객님 입장에서 언제나 최선을 다하겠습니다.\n\n카드결제,문상결제,휴대폰결제 가능\n신규 고객, 단골 고객 10% 할인\n승당제강의 10+1승 서비스 진행\n듀오제강의 10+1판 서비스 진행\n후기 작성 후 다음 진행 시 2,000원 할인\n\n발로란트 대리\n발로란트 듀오\n발로란트 강의\n발로란트 배치\n발로란트 맡김\n발로 대리');
    return;
  }
  if(!client||!Number.isInteger(id)||id<1){
    titleEl.textContent='공지사항을 찾을 수 없습니다.';
    authorEl.textContent='-';
    dateEl.textContent='-';
    viewsEl.textContent='-';
    renderContent('요청하신 공지사항을 찾을 수 없습니다.');
    return;
  }
  try{
    const result=await client.from('notices')
      .select('id,title,content,author,published_at')
      .eq('id',id)
      .maybeSingle();
    if(result.error) throw result.error;
    if(!result.data){
      titleEl.textContent='공지사항을 찾을 수 없습니다.';
      authorEl.textContent='-';
      dateEl.textContent='-';
      viewsEl.textContent='-';
      renderContent('요청하신 공지사항이 존재하지 않습니다.');
      return;
    }
    const notice=result.data;
    titleEl.textContent=notice.title||'';
    authorEl.textContent=notice.author||'관리자';
    dateEl.textContent=formatNoticeDate(notice.published_at);
    viewsEl.textContent='집계 중';
    renderContent(notice.content);
    // 조회수 증가: RPC를 우선 사용하고, 함수가 없거나 실패하면
    // notice_view_counts 테이블을 직접 갱신하는 fallback을 사용합니다.
    const viewResult=await client.rpc('increment_notice_view',{p_notice_id:id});
    if(!viewResult.error){
      const rpcValue=Array.isArray(viewResult.data)
        ? (viewResult.data[0]?.views ?? viewResult.data[0]?.increment_notice_view ?? viewResult.data[0])
        : viewResult.data;
      if(rpcValue !== null && rpcValue !== undefined && rpcValue !== ''){
        viewsEl.textContent=Number(rpcValue||0).toLocaleString('ko-KR');
        return;
      }
    }

    const countResult=await client
      .from('notice_view_counts')
      .select('notice_id,views')
      .eq('notice_id',id)
      .maybeSingle();
    if(countResult.error) throw countResult.error;

    const currentViews=Number(countResult.data?.views||0);
    const nextViews=currentViews+1;

    if(countResult.data){
      const updateResult=await client
        .from('notice_view_counts')
        .update({views:nextViews})
        .eq('notice_id',id);
      if(updateResult.error) throw updateResult.error;
    }else{
      const insertResult=await client
        .from('notice_view_counts')
        .insert({notice_id:id,views:1});
      if(insertResult.error) throw insertResult.error;
    }

    viewsEl.textContent=nextViews.toLocaleString('ko-KR');
  }catch(error){
    console.error('공지사항 상세 처리 실패:',error);
    viewsEl.textContent='-';
  }
}
loadNotice();
</script>
