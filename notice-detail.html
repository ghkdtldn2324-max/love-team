.notice-detail-page{
  min-height:calc(100vh - 118px);
  background:
    radial-gradient(circle at 50% 0%,rgba(112,72,238,.07),transparent 34%),
    #fff;
  padding:68px 20px 110px;
}
.notice-detail-wrap{
  max-width:900px;
  margin:0 auto;
}
.notice-detail-crumb{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  color:#7b61e9;
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
}
.notice-detail-card{
  overflow:hidden;
  border:1px solid #e0dceb;
  border-radius:22px;
  background:#fff;
  box-shadow:0 18px 50px rgba(55,38,110,.08);
}
.notice-detail-title{
  position:relative;
  padding:30px 34px 26px;
  background:
    linear-gradient(135deg,#1b1c2b,#24203a);
  color:#fff;
  border-bottom:1px solid #403a59;
}
.notice-detail-title::after{
  content:"";
  position:absolute;
  left:34px;
  right:34px;
  bottom:0;
  height:2px;
  background:linear-gradient(90deg,#5d7cff,#8b68ff,#c65cff);
}
.notice-detail-kicker{
  margin:0 0 12px;
  color:#a992ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}
.notice-detail-title h1{
  margin:0;
  font-size:30px;
  line-height:1.45;
  letter-spacing:-1.1px;
}
.notice-detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-top:17px;
  color:#c0bdd0;
  font-size:12px;
}
.notice-detail-meta span{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.notice-detail-meta strong{
  color:#f0edf8;
  font-weight:800;
}
.notice-detail-content{
  padding:38px 34px 44px;
  color:#444353;
  font-size:15px;
  line-height:2;
  white-space:pre-wrap;
}
.notice-detail-content .content-intro{
  margin:0 0 28px;
  padding:18px 20px;
  border:1px solid #e2dcf4;
  border-left:4px solid #7957ef;
  border-radius:14px;
  background:linear-gradient(90deg,#f7f4ff,#fcfbff);
  color:#3d3850;
  font-weight:800;
}
.notice-detail-content .content-block{
  margin:0 0 22px;
  padding:21px 22px;
  border:1px solid #ece9f3;
  border-radius:15px;
  background:#fff;
}
.notice-detail-content .content-block:last-child{
  margin-bottom:0;
}
.notice-detail-content .content-label{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
  color:#7048ee;
  font-size:13px;
  font-weight:900;
}
.notice-detail-content .content-label::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:linear-gradient(135deg,#5d7cff,#b24cff);
  box-shadow:0 0 0 5px rgba(112,72,238,.08);
}
.notice-detail-content p{
  margin:0;
  line-height:1.85;
}
.notice-detail-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:18px;
}
.notice-detail-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0 19px;
  border-radius:11px;
  border:1px solid #ddd8ec;
  background:#fff;
  color:#5c526f;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
}
.notice-detail-back:hover{
  border-color:#a18bff;
  color:#7048ee;
}

@media(max-width:600px){
  .notice-detail-page{
    padding:48px 14px 80px;
  }
  .notice-detail-crumb{
    margin-bottom:14px;
    font-size:11px;
  }
  .notice-detail-card{
    border-radius:17px;
  }
  .notice-detail-title{
    padding:25px 20px 22px;
    background:linear-gradient(135deg,#1c1d2c,#292440);
  }
  .notice-detail-title::after{
    left:20px;
    right:20px;
  }
  .notice-detail-title h1{
    font-size:22px;
  }
  .notice-detail-meta{
    gap:7px 12px;
    font-size:10px;
  }
  .notice-detail-content{
    padding:25px 16px 30px;
    font-size:13px;
  }
  .notice-detail-content .content-intro{
    padding:15px 15px;
    margin-bottom:18px;
  }
  .notice-detail-content .content-block{
    padding:17px 15px;
    margin-bottom:14px;
  }
  .notice-detail-bottom{
    flex-direction:column-reverse;
    align-items:stretch;
  }
  .notice-detail-back{width:100%;min-height:44px;}

    <article class="notice-detail-card">
      <header class="notice-detail-title">
        <p class="notice-detail-kicker">OFFICIAL NOTICE</p>
        <h1 id="title"></h1>
        <div class="notice-detail-meta">
          <span>작성자 <strong id="author"></strong></span>

<script>
const id=Number(new URLSearchParams(location.search).get('id')||0);
const titleEl=document.getElementById('title');
const authorEl=document.getElementById('author');
const dateEl=document.getElementById('date');
const viewsEl=document.getElementById('views');
const contentEl=document.getElementById('content');

function renderContent(raw){
  contentEl.innerHTML='';
  const blocks=String(raw||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(!blocks.length){
    contentEl.innerHTML='<p class="content-intro">등록된 공지사항 내용이 없습니다.</p>';
    return;
  }
  const intro=document.createElement('p');
  intro.className='content-intro';
  intro.textContent=blocks.shift();
  contentEl.appendChild(intro);
  blocks.forEach(function(block){
    const lines=block.split(/\n/);
    const first=(lines[0]||'').trim();
    const match=first.match(/^\[([^\]]+)\]\s*$/);
    const section=document.createElement('section');
    section.className='content-block';
    let body=block;
    if(match){
      const label=document.createElement('div');
      label.className='content-label';
      label.textContent=match[1];
      section.appendChild(label);
      body=lines.slice(1).join('\n').trim();
    }
    const p=document.createElement('p');
    p.textContent=body;
    section.appendChild(p);
    contentEl.appendChild(section);
  });
}

async function loadNotice(){
  const client=window.LoveTeamSupabase||window.supabaseClient;
  if(!client||!Number.isInteger(id)||id<1){
    titleEl.textContent='공지사항을 찾을 수 없습니다.';
    authorEl.textContent='-';
    dateEl.textContent='-';
    viewsEl.textContent='-';
    renderContent('요청하신 공지사항을 찾을 수 없습니다.');
    return;
  }
  try{
    const result=await client.from('notices')
      .select('id,title,content,author,published_at')
      .eq('id',id)
      .maybeSingle();
    if(result.error) throw result.error;
    if(!result.data){
      titleEl.textContent='공지사항을 찾을 수 없습니다.';
      authorEl.textContent='-';
      dateEl.textContent='-';
      viewsEl.textContent='-';
      renderContent('요청하신 공지사항이 존재하지 않습니다.');
      return;
    }
    const notice=result.data;
    titleEl.textContent=notice.title||'';
    authorEl.textContent=notice.author||'관리자';
    dateEl.textContent=String(notice.published_at||'').replace(/-/g,'.');
    viewsEl.textContent='집계 중';
    renderContent(notice.content);
    const viewResult=await client.rpc('increment_notice_view',{p_notice_id:id});
    if(viewResult.error) throw viewResult.error;
    viewsEl.textContent=Number(viewResult.data||0).toLocaleString('ko-KR');
  }catch(error){
    console.error('공지사항 상세 처리 실패:',error);
    viewsEl.textContent='-';
  }
}
loadNotice();
</script>
