<head>

<title>LOVE TEAM | 공지사항</title>
<link rel="stylesheet" href="style.css?v=20260930-3">
<style>
/* =========================================================
   LOVE TEAM 공지사항 상세
   기존 게시판 상세 구조를 참고하되 LOVE TEAM 전용
   블랙 + 블루/퍼플 카드 스타일로 재구성
========================================================= */
.notice-detail-page{
  min-height:calc(100vh - 118px);
  background:
    radial-gradient(circle at 50% 0%,rgba(112,72,238,.07),transparent 34%),
    #fff;
  padding:68px 20px 110px;
}
.notice-detail-wrap{
  max-width:900px;
  margin:0 auto;
}
.notice-detail-crumb{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  color:#7b61e9;
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
}
.notice-detail-card{
  overflow:hidden;
  border:1px solid #e0dceb;
  border-radius:22px;
  background:#fff;
  box-shadow:0 18px 50px rgba(55,38,110,.08);
}
.notice-detail-title{
  position:relative;
  padding:30px 34px 26px;
  background:
    linear-gradient(135deg,#10111d,#17132a);
  color:#fff;
  border-bottom:1px solid #302b48;
}
.notice-detail-title::after{
  content:"";
  position:absolute;
  left:34px;
  right:34px;
  bottom:0;
  height:2px;
  background:linear-gradient(90deg,#5d7cff,#8b68ff,#c65cff);
}
.notice-detail-kicker{
  margin:0 0 12px;
  color:#a992ff;
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}
.notice-detail-title h1{
  margin:0;
  font-size:30px;
  line-height:1.45;
  letter-spacing:-1.1px;
}
.notice-detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-top:17px;
  color:#aaa8ba;
  font-size:12px;
}
.notice-detail-meta span{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.notice-detail-meta strong{
  color:#e6e3f0;
  font-weight:800;
}
.notice-detail-content{
  padding:38px 34px 44px;
  color:#444353;
  font-size:15px;
  line-height:2;
  white-space:pre-wrap;
}
.notice-detail-content .content-intro{
  margin:0 0 28px;
  padding:18px 20px;
  border:1px solid #e2dcf4;
  border-left:4px solid #7957ef;
  border-radius:14px;
  background:linear-gradient(90deg,#f7f4ff,#fcfbff);
  color:#3d3850;
  font-weight:800;
}
.notice-detail-content .content-block{
  margin:0 0 22px;
  padding:21px 22px;
  border:1px solid #ece9f3;
  border-radius:15px;
  background:#fff;
}
.notice-detail-content .content-block:last-child{
  margin-bottom:0;
}
.notice-detail-content .content-label{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
  color:#7048ee;
  font-size:13px;
  font-weight:900;
}
.notice-detail-content .content-label::before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:linear-gradient(135deg,#5d7cff,#b24cff);
  box-shadow:0 0 0 5px rgba(112,72,238,.08);
}
.notice-detail-content p{
  margin:0;
  line-height:1.85;
}
.notice-detail-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:18px;
}
.notice-detail-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0 19px;
  border-radius:11px;
  border:1px solid #ddd8ec;
  background:#fff;
  color:#5c526f;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
}
.notice-detail-back:hover{
  border-color:#a18bff;
  color:#7048ee;
}
.notice-detail-contact{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0 19px;
  border-radius:11px;
  background:linear-gradient(90deg,#5d7cff,#9f4cff);
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(105,76,225,.18);
}
@media(max-width:600px){
  .notice-detail-page{
    padding:48px 14px 80px;
  }
  .notice-detail-crumb{
    margin-bottom:14px;
    font-size:11px;
  }
  .notice-detail-card{
    border-radius:17px;
  }
  .notice-detail-title{
    padding:25px 20px 22px;
  }
  .notice-detail-title::after{
    left:20px;
    right:20px;
  }
  .notice-detail-title h1{
    font-size:22px;
  }
  .notice-detail-meta{
    gap:7px 12px;
    font-size:10px;
  }
  .notice-detail-content{
    padding:25px 16px 30px;
    font-size:13px;
  }
  .notice-detail-content .content-intro{
    padding:15px 15px;
    margin-bottom:18px;
  }
  .notice-detail-content .content-block{
    padding:17px 15px;
    margin-bottom:14px;
  }
  .notice-detail-bottom{
    flex-direction:column-reverse;
    align-items:stretch;
  }
  .notice-detail-back,
  .notice-detail-contact{
    width:100%;
  }
}
</style>
</head>
<body>

<header class="header">

</header>
<div class="page-divider" aria-hidden="true"></div>

<main class="notice-detail-page">
  <div class="notice-detail-wrap">
    <div class="notice-detail-crumb"><span>LOVE TEAM NOTICE</span><span>›</span><span>상세보기</span></div>

    <article class="notice-detail-card">
      <header class="notice-detail-title">
        <p class="notice-detail-kicker">OFFICIAL NOTICE</p>
        <h1 id="title"></h1>
        <div class="notice-detail-meta">
          <span>작성자 <strong id="author"></strong></span>
          <span>작성일 <strong id="date"></strong></span>
          <span>조회수 <strong id="views"></strong></span>
        </div>
      </header>

      <div class="notice-detail-content" id="content"></div>
    </article>

    <div class="notice-detail-bottom">
      <a class="notice-detail-back" href="notice.html">← 목록으로</a>
      <a class="notice-detail-contact" href="https://open.kakao.com/" target="_blank" rel="noopener">💬 고객센터 문의</a>
    </div>
  </div>
</main>

<footer><strong>LOVE TEAM</strong><p>© 2026 LOVE TEAM. All rights reserved.</p></footer>

<script>
const notices={
  1:{
    title:'LOVE TEAM 홈페이지 오픈 안내',
    author:'관리자',
    date:'2026.09.29',
    views:128,
    intro:'안녕하세요. LOVE TEAM 홈페이지가 새롭게 오픈되었습니다.',
    blocks:[
      ['홈페이지 안내','가격표, 작업 내역, 후기, 자주 묻는 질문 등 주요 정보를 한 곳에서 편리하게 확인하실 수 있습니다.'],
      ['서비스 이용 안내','원하시는 서비스를 확인하신 뒤 고객센터를 통해 상담을 진행해 주세요.']
    ]
  },
  2:{
    title:'서비스 이용 전 확인사항',
    author:'관리자',
    date:'2026.09.29',
    views:86,
    intro:'서비스 신청 전 아래 내용을 꼭 확인해 주세요.',
    blocks:[
      ['계정 정보 확인','서비스 이용 전 본인의 계정 정보와 신청 내용을 정확하게 확인해 주세요.'],
      ['진행 일정 안내','진행 일정은 상담 후 고객님의 일정에 맞춰 조율해드립니다.']
    ]
  },
  3:{
    title:'고객센터 이용 안내',
    author:'관리자',
    date:'2026.09.29',
    views:54,
    intro:'LOVE TEAM 이용 중 궁금한 점은 언제든 고객센터로 문의해 주세요.',
    blocks:[
      ['상담 방법','홈페이지의 고객센터 버튼을 통해 상담을 요청하실 수 있습니다.'],
      ['문의 내용','서비스 및 진행 일정 등 궁금하신 내용을 남겨주시면 안내해드리겠습니다.']
    ]
  }
};

const id=Number(new URLSearchParams(location.search).get('id')||1);
const n=notices[id]||notices[1];

document.getElementById('title').textContent=n.title;
document.getElementById('author').textContent=n.author;
document.getElementById('date').textContent=n.date;
document.getElementById('views').textContent=n.views;

const content=document.getElementById('content');
content.innerHTML='';

const intro=document.createElement('p');
intro.className='content-intro';
intro.textContent=n.intro;
content.appendChild(intro);

n.blocks.forEach(function(block){
  const section=document.createElement('section');
  section.className='content-block';

  const label=document.createElement('div');
  label.className='content-label';
  label.textContent=block[0];

  const p=document.createElement('p');
  p.textContent=block[1];

  section.appendChild(label);
  section.appendChild(p);
  content.appendChild(section);
});
</script>
