<script>
(function(){
  const client=window.LoveTeamAuth?.client || window.LoveTeamSupabase;
  const root=document.getElementById('reviewDetail');
  const id=new URLSearchParams(location.search).get('id');

  function esc(v){
    return String(v??'').replace(/[&<>"']/g,function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }
  function formatDate(v){
    const d=new Date(v);
    return Number.isNaN(d.getTime()) ? '-' : d.toLocaleDateString('ko-KR');
  }
  function titleFromText(v){
    const s=String(v||'').trim().replace(/\s+/g,' ');
    return s.length>54 ? s.slice(0,54)+'…' : s;
  }

  async function load(){
    if(!root||!client||!id){
      root.innerHTML='<div class="review-detail-card">후기 정보를 찾을 수 없습니다.</div>';
      return;
    }

    const result=await client.from('reviews')
      .select('id,display_name,title,content,service,created_at')
      .eq('id',id)
      .maybeSingle();

    if(result.error||!result.data){
      root.innerHTML='<div class="review-detail-card">후기 정보를 찾을 수 없습니다.</div>';
      return;
    }

    const row=result.data;
    let views=0;
    try{
      const viewResult=await client.rpc('increment_review_view',{target_review_id:row.id});
      if(!viewResult.error) views=Number(viewResult.data)||0;
    }catch(_){
      try{
        const viewResult=await client.from('review_view_counts').select('view_count').eq('review_id',row.id).maybeSingle();
        if(!viewResult.error) views=Number(viewResult.data?.view_count)||0;
      }catch(__){}
    }

    let next=null;
    try{
      const nextResult=await client.from('reviews')
        .select('id,display_name,content,service,created_at')
        .order('created_at',{ascending:false})
        .limit(50);
      if(!nextResult.error){
        const rows=nextResult.data||[];
        const idx=rows.findIndex(function(x){return x.id===row.id;});
        next=idx>=0 ? (rows[idx+1]||null) : null;
      }
    }catch(_){}

    root.innerHTML=
      '<article class="review-detail-card">'+
        '<div class="review-detail-user">'+
          '<div class="review-detail-avatar" aria-hidden="true">●</div>'+
          '<div>'+
            '<div class="review-detail-user-name">'+esc(row.display_name)+'</div>'+
            '<div class="review-detail-meta"><span>REVIEW</span><span>'+esc(formatDate(row.created_at))+'</span><span>조회수 '+esc(views)+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="review-detail-body"><h1 class="review-detail-title">'+esc(row.title || titleFromText(row.content))+'</h1><p>'+esc(row.content)+'</p></div>'+
        '<div class="review-detail-comments"><span>◯</span>0</div>'+
      '</article>'+
      '<div class="review-detail-login" id="reviewDetailLogin">'+
        '<p>로그인이 필요합니다.</p>'+
        '<button type="button" id="reviewDetailLoginButton">로그인</button>'+
      '</div>'+
      (next ? '<div class="review-detail-next"><small>다음 후기</small><a href="review-detail.html?id='+encodeURIComponent(next.id)+'">'+esc(titleFromText(next.content))+'</a></div>' : '')+
      '<div class="review-detail-actions">'+
        '<a class="secondary" href="reviews.html">목록</a>'+
        '<a href="reviews.html#reviewWriteArea">글쓰기</a>'+
      '</div>';

    const loginBox=document.getElementById('reviewDetailLogin');
    async function syncLoginBox(){
      if(!loginBox) return;
      let session=window.LoveTeamSession || null;
      try{
        if(window.LoveTeamAuth?.getSession){
          session=await window.LoveTeamAuth.getSession();
        }
      }catch(_){}
      loginBox.classList.toggle('auth-hidden',!!session);
    }

    syncLoginBox();
    window.addEventListener('love-auth-state',syncLoginBox);
    window.addEventListener('love-auth-changed',syncLoginBox);

    const loginButton=document.getElementById('reviewDetailLoginButton');
    if(loginButton){
      loginButton.addEventListener('click',function(){
        if(window.LoveTeamAuth?.open) window.LoveTeamAuth.open('login');
      });
    }
  }

  load();
})();
</script>
